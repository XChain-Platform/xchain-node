#Credentials
rpcuser=rpc
rpcpassword=rpc
#allow json-rpc requests
server=1
#index all transactions so users can retrieve them with the id
txindex=1
regtest=1
#regtest can't estimate any fee because of the lack of transactions. This will be the fee rate used
fallbackfee=0.00001
printtoconsole=1
listen=1
rpcworkqueue=128
rpcthreads=16
# NOTE: Dogecoin v1.14.x is based on Bitcoin Core 0.14 and does NOT support the [regtest]
# section syntax (added in Bitcoin Core 0.17). All settings below MUST be flat or they get
# silently ignored — daemon then binds RPC to its default 127.0.0.1:18332 and no external
# service can talk to it. Keep these out of any [section] block.
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=18444
rpctimeout=30
limitdescendantcount=2500
limitdescendantsize=3000
