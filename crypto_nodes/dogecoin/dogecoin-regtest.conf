#Credentials
rpcuser=rpc
rpcpassword=rpc
#allow json-rpc requests
server=1
#index all transactions so users can retrieve them with the id
txindex=1
regtest=1
#regtest can't estimate any fee because of the lack of transactions. This will be the fee rate used
fallbackfee=0.00001
printtoconsole=1
listen=1
rpcworkqueue=128
rpcthreads=16
# NOTE: Dogecoin v1.14.x is based on Bitcoin Core 0.14 and does NOT support the [regtest]
# section syntax (added in Bitcoin Core 0.17). All settings below MUST be flat or they get
# silently ignored — daemon then binds RPC to its default 127.0.0.1:18332 and no external
# service can talk to it. Keep these out of any [section] block.
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=18444
rpctimeout=30
limitdescendantcount=2500
limitdescendantsize=3000
# Mempool relax for regtest. Dogecoin v1.14 inherits Bitcoin Core 0.14's
# legacy free-transaction priority admission policy ("66: insufficient
# priority" from AcceptToMemoryPoolWorker), which rejects the small,
# low-input-age P2SH-encoded ISSUE V0 transactions the e2e suite produces.
# Bitcoin Core dropped priority around 0.15; Dogecoin v1.14 kept it.
# minrelaytxfee=0.00000001 (1 koinu/kB — dogecoind refuses literal 0 with
# "Invalid amount") is below any real-tx fee, so nModifiedFees is always
# >= the fee-floor and the priority check never runs. limitfreerelay
# raises the free-tx rate-limit ceiling for the rare case priority does
# kick in. acceptnonstdtxn=1 (regtest default but explicit here) accepts
# the non-standard scripts the encoder emits.
minrelaytxfee=0.00000001
limitfreerelay=99999
acceptnonstdtxn=1
