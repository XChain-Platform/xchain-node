# Kaspa node configuration (testnet = TN-10)
#
# Ports come from the help text in kaspad/src/args.rs:
#   gRPC 16210 · P2P 16211 · wRPC-Borsh 17210 · wRPC-JSON 18210
#   (note: the two wRPC ports are separate per network, not shared)
#
# Measured TN-10 facts (2026-10-11, kaspad v2.1.0):
#   · the default suffix is 10 (`--netsuffix` default); `--testnet` is TN-10
#   · first sync scale: 248,699 chain heads to the pruning point, then 1,476,465 IBD headers, then the UTXO set
#     (the UTXO set takes very long: 260M+ entries locally and still going, with every RPC returning
#      "consensus is currently in a transitional ibd state")
#   · so for the indexer, use an archival node and leave --retention-period-days to operations

appdir = "/data/kaspa"
logdir = "/data/kaspa/logs"

testnet = true
utxoindex = true
archival = true
disable-upnp = true

rpclisten       = "0.0.0.0:16210"
rpclisten-borsh = "0.0.0.0:17210"
rpclisten-json  = "0.0.0.0:18210"
listen          = "0.0.0.0:16211"
