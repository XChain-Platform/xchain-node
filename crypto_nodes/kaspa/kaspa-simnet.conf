# Kaspa node configuration (simnet)
#
# The simnet default ports are unverified (the args.rs help only lists mainnet and testnet).
# The four ports below are what this project measured and chose, not node defaults - explicit
# by convention. Anything that talks to xchain-node's auto-configuration must pass them
# explicitly: portsFor in kaspa_node.js refuses to return a default for simnet on purpose.
#
# Measured locally (simnet bootstrap, 2026-10-11):
#   · starting from genesis requires `--enable-unsynced-mining`
#     (args.rs, verbatim: "required when initiating a new network from genesis")
#   · no PoW (params.rs: simnet skip_proof_of_work=true); mining = getBlockTemplate + submitBlock;
#     `extraData` must be a byte array `[]`; `allowNonDaaBlocks: true` is a sibling of block
#   · coinbase maturity is 1000 blocks (not 100); simnet does not mine by itself, so transactions sit in the mempool
#   · the shipped rothschild supports testnet/devnet only, so simnet needs its own block producer

appdir = "/data/kaspa"
logdir = "/data/kaspa/logs"

simnet = true
utxoindex = true
disable-upnp = true

# Non-default values: this project's convention (see the file header)
rpclisten       = "0.0.0.0:16510"
rpclisten-borsh = "0.0.0.0:17510"
rpclisten-json  = "0.0.0.0:18510"
listen          = "0.0.0.0:16511"
