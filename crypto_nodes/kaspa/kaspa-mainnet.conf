# Kaspa node configuration (mainnet) - TOML for the file, CLI for overrides
#
# Keys must be kaspad's kebab-case field names: it deserializes with serde(deny_unknown_fields),
# so a misspelled key refuses to start. That is the good kind of failure.
#
# Ports come from the help text in kaspad/src/args.rs:
#   gRPC 16110 · P2P 16111 · wRPC-Borsh 17110 · wRPC-JSON 18110
#
# Notes:
#   utxoindex  - the indexer and wallets look UTXOs up by address, so this must be on
#   archival   - required by the indexer: KIP-15 keeps roughly 30 hours of transactions and
#                block headers, so a full action history needs archiving. Heavy on disk.
#   appdir     - data directory (a volume inside the container)

appdir = "/data/kaspa"
logdir = "/data/kaspa/logs"

# look UTXOs up by address (Kaspa's utxoindex)
utxoindex = true

# full archive: on for the indexer, off for wallet/relay only
archival = true

# UPnP is not needed in a container (measured: it spams errors)
disable-upnp = true

# listen: exposed inside the container; docker port mapping decides reachability
rpclisten       = "0.0.0.0:16110"
rpclisten-borsh = "0.0.0.0:17110"
rpclisten-json  = "0.0.0.0:18110"
listen          = "0.0.0.0:16111"
