#Credentials
rpcuser=__XCHAIN_NODE_RPC_USER__
rpcpassword=__XCHAIN_NODE_RPC_PASSWORD__
#allow json-rpc requests
server=1
#index all transactions so users can retrieve them with the id
txindex=1
regtest=1
#regtest can't estimate any fee because of the lack of transactions. This will be the fee rate used
fallbackfee=0.00001
printtoconsole=1
listen=1
rpcworkqueue=128
rpcthreads=16
# Mempool relax for regtest, FLAT (not under [regtest]) so it applies unconditionally -
# matching dogecoin-regtest.conf. Litecoin's default dust-relay fee + standardness rules
# reject the small P2SH/multi-data outputs the XChain encoder emits (ISSUE/ORDER/SWAP),
# failing broadcast with "dust" / "multi-op-return". These zero the dust floor, floor the
# min-relay fee, lift the free-relay ceiling, raise the OP_RETURN data limit, and accept the
# non-standard scripts the encoder produces. (The [regtest]-section copy below was silently
# ineffective on the deployed node - keep it flat.)
dustrelayfee=0
minrelaytxfee=0.00000001
limitfreerelay=99999
datacarriersize=1000
acceptnonstdtxn=1

[regtest]
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=18444
rpctimeout=30
limitdescendantcount=2500
limitdescendantsize=3000
# Disable MWEB BIP9 deployment on regtest. At MWEB activation (default
# height 432), litecoind's block-template builder produces an HogEx tx
# with empty vin and TestBlockValidity rejects every subsequent block
# with bad-txns-vin-empty - the miner gets stuck and the chain never
# advances. Setting start=end=0 keeps MWEB perpetually in 'failed'
# state for regtest, which is fine because the XChain e2e suite doesn't
# exercise MWEB peg-in/peg-out.
vbparams=mweb:0:0
# Litecoin's default dust-relay fee rejects the small P2SH/data outputs that
# XChain ISSUE/encode transactions create (these broadcast fine on bitcoin's
# lower dust threshold). Zero the dust-relay fee and floor min-relay on regtest
# so e2e ISSUE V0 broadcasts aren't rejected with "dust" (code -26). Mirrors the
# dogecoin-regtest mempool tuning.
dustrelayfee=0
minrelaytxfee=0.00000001
acceptnonstdtxn=1
