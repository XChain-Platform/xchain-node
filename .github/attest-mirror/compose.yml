      ENCODER_API_PORT: 3003
      ENCODER_RATE_LIMIT_RPM: 99999
      CORS_ORIGIN: "*"
    ports:
      - "127.0.0.1:${LTC_ENCODER_HOST_PORT}:3003"
    healthcheck:
