      NODE_PASSWORD: ${RPC_PASSWORD}
      DECODER_DB_HOST: db
      DECODER_DB_PORT: 3306
      DECODER_DB_NAME: XChain_LTC_Regtest_Decoder
      DECODER_DB_USER: root
      DECODER_DB_PASS: ${DB_PASSWORD}
      DECODER_API_PORT: 3002
    ports:
