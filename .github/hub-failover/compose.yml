      INDEXER_COIN: LTC
      INDEXER_DB_NAME: XChain_LTC_Regtest_Indexer
      DECODER_DB_NAME: XChain_LTC_Regtest_Decoder
      UTXO_TRACKER_URL: ltc-tracker
