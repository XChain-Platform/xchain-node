    depends_on:
      db-init:
        condition: service_completed_successfully
      doge-node:
        condition: service_healthy
    environment:
      COIN: dogecoin
      NETWORK: dogecoin-regtest
      NODE_URL: doge-node
      NODE_PORT: 18444
      NODE_USER: ${RPC_USER:-hub-failover}
      NODE_PASSWORD: ${RPC_PASSWORD:-hub-failover-rpc}
      DECODER_DB_HOST: db
      DECODER_DB_PORT: 3306
      DECODER_DB_NAME: XChain_DOGE_Regtest_Decoder
      DECODER_DB_USER: root
      DECODER_DB_PASS: ${DB_PASSWORD:-hub-failover-db}
      DECODER_API_PORT: 3002
    ports:
      - "127.0.0.1:${DOGE_DECODER_HOST_PORT:-64222}:3002"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/live >/dev/null 2>&1"]
    restart: unless-stopped

  doge-encoder:
    image: xchain-node-dogecoin-regtest-xchain-encoder
    depends_on:
      doge-node:
        condition: service_healthy
      doge-tracker:
        condition: service_healthy
    environment:
      NETWORK: dogecoin-regtest
      NODE_URL: doge-node
      NODE_PORT: 18444
      NODE_USER: ${RPC_USER:-hub-failover}
      NODE_PASSWORD: ${RPC_PASSWORD:-hub-failover-rpc}
      UTXO_TRACKER_URL: doge-tracker
      UTXO_TRACKER_API_PORT: 3001
      ENCODER_API_PORT: 3003
      ENCODER_RATE_LIMIT_RPM: 99999
      CORS_ORIGIN: "*"
    ports:
      - "127.0.0.1:${DOGE_ENCODER_HOST_PORT:-64223}:3003"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/status >/dev/null 2>&1"]
    restart: unless-stopped

  doge-indexer:
    image: xchain-node-dogecoin-regtest-xchain-indexer
    depends_on:
      db-init:
        condition: service_completed_successfully
      doge-decoder:
        condition: service_healthy
      doge-tracker:
        condition: service_healthy
      hub-a:
        condition: service_healthy
      hub-b:
        condition: service_healthy
      hub-federation-init:
        condition: service_completed_successfully
    environment:
      <<: [*indexer-environment, *failover-environment]
      INDEXER_COIN: DOGE
      INDEXER_DB_NAME: XChain_DOGE_Regtest_Indexer
      DECODER_DB_NAME: XChain_DOGE_Regtest_Decoder
      UTXO_TRACKER_URL: doge-tracker
      UTXO_TRACKER_API_PORT: 3001
      HUB_DB_NAME: XChain_DOGE_Regtest_Indexer
    ports:
      - "127.0.0.1:${DOGE_INDEXER_HOST_PORT:-64224}:3004"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/status 2>/dev/null | grep -Eq '\"bootstrapped\"[[:space:]]*:[[:space:]]*true'"]
    restart: unless-stopped

volumes:
  db-data:
  btc-node-data:
  btc-tracker-data:
  ltc-node-data:
  ltc-tracker-data:
  doge-node-data:
  doge-tracker-data:
