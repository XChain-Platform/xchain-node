name: Attest-mirror leg (regtest)

run-name: >-
  Attest-mirror legs @ e2e ${{ inputs.e2e_ref || 'develop' }} ${{ inputs.legs || '(all)' }}

# Runs L004-ACC's attest-mirror legs (`BF_STAMP_AHEAD_S=900 npm run test:attest-mirror`
# in xchain-e2e-test) on GitHub-hosted runners, ONE leg per job, all in parallel,
# through the same runner the self-hosted venues use (scripts/run-attest-mirror.js
# with scripts/attest-mirror-stack-driver.sh), instead of three legs at a time on
# one venue disk.
#
# The stack root in .github/attest-mirror/ is test02's pb-v020-at7 root (compose.yml,
# setup-stack.sh, run-leg.sh, seed-stack-config.js, wait-indexer-schema.js) with
# only its host paths made relative: the driver boots an isolated BTC+LTC+DOGE
# compose stack per leg from the xchain-node images, which this job builds first by
# installing the three regtest stacks. The federation mnemonic the venue keeps in
# at7.env is generated per job and masked.
#
# EVIDENCE: artifact am-<leg stem> holds the runner output, the leg log and the
# venue logs; the leg's verdict is its exit code, as on the venue.

on:
  # A push to a gh-rail/** branch that edits .github/attest-mirror-run.json runs the
  # legs that file names; it also registers this workflow for dispatch off the
  # default branch.
  push:
    branches: ['gh-rail/**']
    paths: ['.github/attest-mirror-run.json']
  workflow_dispatch:
    inputs:
      e2e_ref:
        description: 'xchain-e2e-test ref the legs run from'
        type: string
        default: develop
      legs:
        description: 'Comma-separated leg files (test/attestMirror/...); empty runs all'
        type: string
        default: ''
      stack_ref:
        description: 'Ref the service images and source roots are built at'
        type: string
        default: develop

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      e2e_ref: ${{ steps.legs.outputs.e2e_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: List the legs
        id: legs
        env:
          E2E_REF: ${{ inputs.e2e_ref || 'develop' }}
          LEGS_INPUT: ${{ inputs.legs }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            E2E_REF=$(node -p 'require("./.github/attest-mirror-run.json").e2e_ref')
            LEGS_INPUT=$(node -p 'require("./.github/attest-mirror-run.json").legs.join(",")')
          fi
          echo "e2e_ref=$E2E_REF" >> "$GITHUB_OUTPUT"
          git clone -q https://github.com/XChain-Platform/xchain-e2e-test.git e2e
          git -C e2e fetch -q origin "$E2E_REF" && git -C e2e checkout -q FETCH_HEAD
          if [ -n "$LEGS_INPUT" ]; then
            LEGS=$(node -e 'console.log(JSON.stringify(process.argv[1].split(",").map(s=>s.trim()).filter(Boolean)))' "$LEGS_INPUT")
          else
            LEGS=$(cd e2e && ls test/attestMirror/*.test.js test/attestMirror/barrier_family/*.test.js | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(s.split("\n").filter(Boolean))))')
          fi
          echo "$LEGS"
          echo "legs=$LEGS" >> "$GITHUB_OUTPUT"

  leg:
    needs: plan
    name: ${{ matrix.leg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    timeout-minutes: 240
    env:
      STACK_REF: ${{ inputs.stack_ref || 'develop' }}
      E2E_REF: ${{ needs.plan.outputs.e2e_ref }}
      XCHAIN_NODE_EXTERNAL_DB: '1'
      XCHAIN_NODE_EXTERNAL_DB_HOST: '172.17.0.1'
      XCHAIN_NODE_EXTERNAL_DB_PORT: '3306'
      XCHAIN_NODE_EXTERNAL_DB_ROOT_USER: 'root'
      XCHAIN_NODE_DATA_DIR: ${{ github.workspace }}/.xchain-data
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h /; nproc; free -g

      # AFTER the reclaim, which deletes the tool cache setup-node installs into;
      # before it, later steps silently fell back to the image's own Node (v22.23.2
      # on some images, v22.23.3 on others, the latter failing the consensus pin).
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Start headless MariaDB (for the image-building install)
        run: |
          XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD"
          echo "XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD=$XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name xchain-ci-db \
            -e MARIADB_ROOT_PASSWORD="$XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD" \
            -p 3306:3306 mariadb:11 --max-connections=1000
          for i in $(seq 1 30); do
            if docker exec xchain-ci-db mariadb-admin -uroot -p"$XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD" ping 2>/dev/null | grep -q "is alive"; then
              echo "MariaDB ready"; break
            fi
            sleep 3
          done

      - name: Build the service images (install the three regtest stacks)
        run: |
          npm ci
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          write_ports() {
            local file="$1" base="$2"; shift 2
            {
              echo "NODE_EXPOSED_PORT=$base"
              echo "UTXO_TRACKER_PORT=$((base + 1))"
              echo "DECODER_PORT=$((base + 2))"
              echo "ENCODER_PORT=$((base + 3))"
              echo "INDEXER_PORT=$((base + 4))"
              echo "REGTEST_MINER_PORT=$((base + 5))"
              for line in "$@"; do echo "$line"; done
            } > "$file"
          }
          mkdir -p config "$XCHAIN_NODE_DATA_DIR"
          write_ports config/bitcoin-regtest 3020
          write_ports config/dogecoin-regtest 3120 "BTC_SERVICE_HOST=$XCHAIN_NODE_EXTERNAL_DB_HOST" \
            "BTC_INDEXER_API_URL=http://xchain-node-bitcoin-regtest-xchain-indexer:3004"
          write_ports config/litecoin-regtest 3220 "BTC_SERVICE_HOST=$XCHAIN_NODE_EXTERNAL_DB_HOST" \
            "BTC_INDEXER_API_URL=http://xchain-node-bitcoin-regtest-xchain-indexer:3004"
          node src/index.js install "$STACK_REF" all bitcoin regtest
          node src/index.js install "$STACK_REF" all litecoin regtest
          node src/index.js install "$STACK_REF" all dogecoin regtest
          # The isolated stacks bring their own coin services; keep only the
          # standing hub and explorer (the leg reads the explorer on 18080, as on test02).
          for c in $(docker ps --format '{{.Names}}' | grep -E '^xchain-node-(litecoin|dogecoin)-regtest-'); do docker stop "$c" >/dev/null; done
          docker pull -q mariadb:10.11 && docker tag mariadb:10.11 xchain-node-database
          docker images --format '{{.Repository}}' | grep '^xchain-node-' | sort
          docker ps --format '{{.Names}} {{.Status}}'

      - name: Build the source root (e2e at ${{ needs.plan.outputs.e2e_ref }})
        run: |
          ROOT="$RUNNER_TEMP/rail"
          mkdir -p "$ROOT"
          echo "RAIL_ROOT=$ROOT" >> "$GITHUB_ENV"
          ln -sfn "$GITHUB_WORKSPACE" "$ROOT/xchain-node"
          git clone -q https://github.com/XChain-Platform/xchain-e2e-test.git "$ROOT/xchain-e2e-test"
          git -C "$ROOT/xchain-e2e-test" fetch -q origin "$E2E_REF"
          git -C "$ROOT/xchain-e2e-test" checkout -q FETCH_HEAD
          echo "e2e at $(git -C "$ROOT/xchain-e2e-test" rev-parse HEAD) ($E2E_REF)"
          REPOS="xchain-hub xchain-indexer xchain-vm xchain-sdk xchain-decoder xchain-utxo-tracker xchain-encoder xchain-explorer xchain-documentation xchain-contracts xchain-regtest-miner xchain-sync"
          for r in $REPOS; do git clone -q --depth 1 --branch "$STACK_REF" "https://github.com/XChain-Platform/$r.git" "$ROOT/$r" & done
          wait
          for r in $REPOS; do echo "$r at $(git -C "$ROOT/$r" rev-parse --short HEAD 2>/dev/null)"; done
          ln -sfn ../xchain-vm "$ROOT/xchain-indexer/xchain-vm"
          for s in xchain-hub xchain-sdk xchain-vm; do ln -sfn "../$s" "$ROOT/xchain-e2e-test/$s"; done
          for r in xchain-vm xchain-hub xchain-sdk xchain-decoder xchain-utxo-tracker xchain-encoder; do
            (cd "$ROOT/$r" && npm ci --no-audit --no-fund --silent > "$RUNNER_TEMP/npm-$r.log" 2>&1 || { echo "npm ci failed in $r"; tail -30 "$RUNNER_TEMP/npm-$r.log"; exit 1; }) &
          done
          wait
          (cd "$ROOT/xchain-indexer" && npm ci --no-audit --no-fund --silent)
          (cd "$ROOT/xchain-e2e-test" && npm ci --no-audit --no-fund --silent)
          # The in-process venue indexers refuse any runtime but the fleet's pinned
          # one (xchain-vm/src/consensus-runtime.js: v8, icu, unicode, cldr, ABI 127),
          # so check the job's Node against that pin before spending a drive on it.
          node -e 'const c=require(process.argv[1]+"/xchain-vm/src/consensus-runtime.js"); const r=c.checkConsensusRuntime(); console.log("node "+process.version+" consensus runtime: "+c.describeMismatch(r)); process.exit(r.ok?0:1)' "$ROOT"

      - name: Stage the stack root
        run: |
          S="$RUNNER_TEMP/am"
          cp -r .github/attest-mirror "$S"
          chmod +x "$S"/*.sh
          umask 077
          M=$(node -e 'console.log(require(process.argv[1] + "/node_modules/bip39").generateMnemonic())' "$RAIL_ROOT/xchain-e2e-test")
          echo "::add-mask::$M"
          printf 'XC_ROLLCALL_FEDERATION_MNEMONIC="%s"\n' "$M" > "$S/at7.env"
          echo "AM_ROOT=$S" >> "$GITHUB_ENV"
          echo "L004_LOG_DIR=$RUNNER_TEMP/am-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/am-logs"

      - name: Run ${{ matrix.leg }}
        working-directory: ${{ env.RAIL_ROOT }}/xchain-e2e-test
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set +e
          env L004_VENUE_ROOT="$RAIL_ROOT" ATTEST_MIRROR_CONCURRENCY=1 ATTEST_MIRROR_READY_TIMEOUT_MS=1200000 \
            ATTEST_MIRROR_STACK_ROOT="$AM_ROOT" ATTEST_MIRROR_STACK_PREFIX=xca7 \
            ATTEST_MIRROR_PORT_BASE=62100 ATTEST_MIRROR_VENUE_PORT_BASE=63400 \
            ATTEST_MIRROR_LEGS="$LEG" \
            ATTEST_MIRROR_STACK_DRIVER="$RAIL_ROOT/xchain-e2e-test/scripts/attest-mirror-stack-driver.sh" \
            ATTEST_MIRROR_E2E_DIR="$RAIL_ROOT/xchain-e2e-test" ATTEST_MIRROR_EXPLORER_PORT=18080 \
            BF_STAMP_AHEAD_S=900 node scripts/run-attest-mirror.js 2>&1 | tee "$L004_LOG_DIR/runner.log"
          rc=${PIPESTATUS[0]}
          echo "runner exit $rc"
          for f in "$L004_LOG_DIR"/*.log; do [ "$f" = "$L004_LOG_DIR/runner.log" ] && continue; echo "=== $f"; tail -60 "$f"; done
          exit "$rc"

      - name: Name the artifact
        if: always()
        env:
          LEG: ${{ matrix.leg }}
        run: echo "AM_ARTIFACT=am-$(basename "$LEG" .test.js)" >> "$GITHUB_ENV"

      - name: Upload the leg logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AM_ARTIFACT }}
          path: ${{ runner.temp }}/am-logs/
          if-no-files-found: warn
          retention-days: 30
