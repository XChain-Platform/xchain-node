name: E2E (regtest)

# Cross-component integration gate. Boots the FULL XChain stack on regtest via
# xchain-node - which clones every service repo at the REF THIS RUN NAMES and
# runs them as Docker containers - then runs the live xchain-e2e-test suites against it
# (real transactions, real indexing, reorg convergence): the default ACTION suite,
# the SECURITY suite (test/security), and the PERFORMANCE suite (test/perf), each
# driven via `e2etest --script`. This is the only gate that exercises consensus /
# money movement end-to-end; the per-repo CI jobs are single-process unit tests.
# On-demand (workflow_dispatch) - a full bring-up is heavy (clones + image builds
# + a coin daemon), so it is NOT per-push; the nightly schedule is deferred (see
# the `on:` block) until the repos are public.
#
# ─────────────────────────────────────────────────────────────────────────────
# STATUS: VALIDATED THROUGH STACK CLONE-PREP (manual workflow_dispatch, bitcoin,
# 2026-06-03). Green through: checkout, node 22, disk reclaim, headless MariaDB
# bring-up, dep install, and the SSH→HTTPS clone rewrite. The install process
# reaches the external DB (creates its DB on 172.17.0.1:3306) - so that env path
# is proven. BLOCKER: the sub-repos are PRIVATE, so cloning them on a hosted
# runner needs a SUBREPO_CLONE_TOKEN secret (see the rewrite step) OR the repos
# to be made public - until one of those, the boot step fails at the first clone,
# so on GitHub this runs only with a token; locally (dev box with the stack up)
# the same `e2etest --script test:security|test:perf:budget` commands work today
# and are verified (13 + 8 passing). A dedicated self-hosted runner was considered
# and dropped as premature - once the repos are public this hosted job runs for
# free with no box. Still to confirm once it boots on a hosted runner: service→DB
# container networking, then add litecoin / dogecoin (run-multichain-e2e.sh).
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Manual / on-demand gate. The nightly schedule is intentionally DISABLED while the
  # sub-repos are PRIVATE - a scheduled run would fail at the first private clone and
  # spam nightly failures. Re-enable it once the repos are public per the launch plan
  # (anonymous HTTPS clones just work then, and no SUBREPO_CLONE_TOKEN is needed):
  #   schedule:
  #     - cron: '0 7 * * *'    # 07:00 UTC nightly
  #
  # NOTE for whoever re-enables the cron: a scheduled workflow runs from the
  # DEFAULT branch's file, so once develop is the default the nightly boots
  # whatever `ref` defaults to below. Set that default deliberately at the same
  # time, or the nightly silently changes what it is testing.
  workflow_dispatch:
    inputs:
      coin:
        description: 'Coin to test'
        type: choice
        options: [bitcoin, litecoin, dogecoin]
        default: bitcoin
      suite:
        # ONE suite instead of the whole action set, so fixing a defect costs a boot
        # plus that suite rather than a two-hour full pass. Takes the file-name stem
        # e2etest already accepts (e.g. "attestation", "order"). Empty runs everything,
        # which is what a release gate must do; a subset proves a fix, never the train.
        # The security and performance suites are skipped while a subset is running,
        # because they grade the whole stack and a partial action pass does not earn them.
        description: 'Single action suite to run (file stem, e.g. attestation). Empty = full suite.'
        type: string
        default: ''
      validator:
        # Boot the stack's hub as a full VALIDATOR rather than the standalone
        # config oracle it runs as by default.
        #
        # Opt-in, and default false on purpose. Validator mode is not a superset
        # of standalone: peerManager exists, so startOracle() proceeds and the hub
        # begins finalizing its own price rounds. Several action suites branch on
        # exactly that (the fee fixtures compute an output size FROM a pair they
        # seed, and skip when the venue publishes its own XCHAIN/USD), so flipping
        # this for the whole matrix would silently change what the gate measures.
        #
        # Turn it on for the validator-onboarding suite, which STAKEs the hub's
        # signing pubkey and asserts the indexer admits it - the one suite that
        # cannot run against a hub with no identity, and which skips itself when
        # VALIDATOR_PUBKEY is absent.
        description: 'Run the hub as a validator (needed by the onboardValidator suite; changes the price regime)'
        type: boolean
        default: false
      ref:
        # The release ceremony's freeze step needs a driven e2e run against the
        # EXACT content a release is being cut from, not against a branch tip
        # that agent lanes keep moving. That is what this input is for.
        #
        # Three shapes are useful, and they resolve differently on purpose:
        #   master / develop     branch tip; the ordinary integration run
        #   release/vX.Y.Z       the frozen release branches, for the ceremony's
        #                        pre-PR gate (see the caveat below)
        #   vX.Y.Z               a published release: xchain-node resolves its
        #                        release manifest and installs the exact pinned,
        #                        commit-verified component set. This is the only
        #                        shape that reproduces a release byte for byte,
        #                        and it is the right one for verifying a train
        #                        after its tags are cut.
        #
        # CAVEAT for the release/vX.Y.Z shape: `install` clones EVERY train
        # member at the one ref it is given, so a ceremony that cuts release
        # branches only in the CHANGED repos (sparse lockstep) will fail at the
        # first unchanged sibling that has no such branch. Either cut the
        # release branch in every train member for the duration of the freeze,
        # or run this against vX.Y.Z after tagging and treat the pre-PR e2e as
        # covering the changed set only.
        description: 'Ref to install the stack at (branch, release/vX.Y.Z, or a published vX.Y.Z)'
        type: string
        default: develop

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COIN: ${{ github.event.inputs.coin || 'bitcoin' }}
      # Drives BOTH the xchain-node checkout below and the `install` boot
      # argument, so the CLI running the install is the same version as the
      # stack it installs. Splitting those two was how "we tested the release"
      # could mean "we tested master's installer against the release".
      STACK_REF: ${{ github.event.inputs.ref || 'develop' }}
      SUITE: ${{ github.event.inputs.suite || '' }}
      # Headless DB: point xchain-node at an external MariaDB instead of its
      # bundled DB container, so the first install does NOT stop on the
      # interactive root-password prompt (see DatabaseService.getExternalDbConfig
      # - these five vars are the documented headless fast-path).
      XCHAIN_NODE_EXTERNAL_DB: '1'
      # VALIDATE: 172.17.0.1 is the default docker-bridge gateway - reachable from
      # xchain-node's spawned service containers to the host-published MariaDB
      # port below. If xchain-node puts services on a custom network, this host
      # may need to be the runner's LAN IP or the DB run on that same network.
      XCHAIN_NODE_EXTERNAL_DB_HOST: '172.17.0.1'
      XCHAIN_NODE_EXTERNAL_DB_PORT: '3306'
      XCHAIN_NODE_EXTERNAL_DB_ROOT_USER: 'root'
      # Root password is GENERATED per run by the "Start headless MariaDB" step
      # below and exported through GITHUB_ENV, so no credential-shaped literal is
      # committed. The container is ephemeral and runner-local.
      # GH runners are native ext4, so coin-node data is safe in the workspace
      # (the native-ext4 requirement only bites on the Parallels dev VM).
      XCHAIN_NODE_DATA_DIR: ${{ github.workspace }}/.xchain-data

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'develop' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reclaim runner disk (coin daemon + per-service images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h /

      - name: Start headless MariaDB (host-published so spawned containers reach it)
        run: |
          XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD="$(openssl rand -hex 24)"

          echo "::add-mask::$XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD"

          echo "XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD=$XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD" >> "$GITHUB_ENV"

          docker run -d --name xchain-ci-db \
            -e MARIADB_ROOT_PASSWORD="$XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD" \
            -p 3306:3306 mariadb:11
          # Wait for readiness before xchain-node tries to connect.
          for i in $(seq 1 30); do
            if docker exec xchain-ci-db mariadb-admin -uroot -p"$XCHAIN_NODE_EXTERNAL_DB_ROOT_PASSWORD" ping 2>/dev/null | grep -q "is alive"; then
              echo "MariaDB ready"; break
            fi
            echo "waiting for MariaDB ($i)"; sleep 3
          done

      - name: Install xchain-node deps
        run: npm ci

      # xchain-node's module URLs are SSH form (git@github.com:XChain-Platform/…).
      # The runner has no SSH deploy key, so SSH clones fail with
      # "Permission denied (publickey)". Rewrite them to HTTPS for the job.
      #
      # The sub-repos are PRIVATE today, so anonymous HTTPS clones fail with
      # "could not read Username for 'https://github.com'". The automatic
      # GITHUB_TOKEN is scoped to THIS repo only and cannot read the siblings,
      # so a token with org-wide `contents: read` is required:
      #   - Add a repo/org secret SUBREPO_CLONE_TOKEN (a fine-grained PAT or a
      #     GitHub App installation token granting read on the XChain-Platform
      #     sub-repos), and this step authenticates the HTTPS clones with it.
      #   - Once the sub-repos are made public (pre-launch plan), the token
      #     becomes unnecessary - the anonymous-HTTPS fallback below just works.
      # If neither applies, the next step fails fast at the first private clone.
      - name: Rewrite sub-repo clones to HTTPS (token-auth if SUBREPO_CLONE_TOKEN set)
        env:
          SUBREPO_CLONE_TOKEN: ${{ secrets.SUBREPO_CLONE_TOKEN }}
        run: |
          if [ -n "$SUBREPO_CLONE_TOKEN" ]; then
            echo "Using SUBREPO_CLONE_TOKEN for authenticated HTTPS clones."
            git config --global url."https://x-access-token:${SUBREPO_CLONE_TOKEN}@github.com/".insteadOf "git@github.com:"
          else
            echo "::warning::SUBREPO_CLONE_TOKEN not set - falling back to anonymous HTTPS."
            echo "::warning::This only works once the XChain-Platform sub-repos are public; private repos will fail at clone."
            git config --global url."https://github.com/".insteadOf "git@github.com:"
          fi

      - name: Initialize the validator identity (opt-in; must precede install)
        if: github.event.inputs.validator == 'true'
        # MUST run before install: ConfigService reads the settings this writes
        # when it generates the hub's container env (getValidatorEnv) and the
        # e2e container's VALIDATOR_PUBKEY. Initializing afterwards would leave
        # both already rendered from a standalone config.
        #
        # The hub fails loud in validator mode on two vars the standalone path
        # never needs, and both are host-env passthroughs rather than anything
        # `validator init` writes, so they are exported here for every later step:
        #   HUB_NETWORK           consensus gating (STAKE_WEIGHTED_QUORUM height
        #                         is per network); hub exits 1 when blank/invalid
        #   ORACLE_MIN_SUBMISSIONS  a lone validator can never reach the default
        #                         2-hub diversity floor, so no round would ever
        #                         finalize and every indexer's price-sync barrier
        #                         would stall
        # ORACLE_EPOCH_START is also required, but `validator init` persists it
        # into validator.json and getValidatorEnv injects it, so it is passed as
        # a flag rather than exported. Its value only has to be shared across a
        # federation; this venue is a single hub, so the run's own clock is fine.
        run: |
          node src/index.js validator init \
            --oracle-epoch-start "$(date -u +%s)000" \
            --capabilities price,cross_chain,oracle_publish,attestation
          {
            echo "HUB_NETWORK=regtest"
            echo "ORACLE_MIN_SUBMISSIONS=1"
          } >> "$GITHUB_ENV"
          # Prints the pubkey and never the seed (validator status reads the
          # settings file; the 0600 signing.key is not echoed).
          node src/index.js validator status

      - name: Boot the regtest stack (clones every service at ${{ github.event.inputs.ref || 'develop' }})
        # First heavy step - repo clones + docker image builds + coin daemon.
        # Watch disk and image-build time here (the 120-min job timeout covers it).
        # Note: the external-DB connection for the install process itself is
        # already proven - it creates the xchain-node DB on 172.17.0.1:3306 before
        # this step. Service→DB networking (spawned containers → host DB) is the
        # remaining thing to confirm once the stack boots.
        run: |
          mkdir -p "$XCHAIN_NODE_DATA_DIR"
          echo "Installing the stack at ref: $STACK_REF"
          node src/index.js install "$STACK_REF" all "$COIN" regtest

      - name: Run the e2e action suite
        # Now exits non-zero on failure (cli.js e2etest propagates the suite's
        # exit code), so this step natively gates the job.
        run: node src/index.js e2etest "$COIN" $SUITE --ref "$STACK_REF"

      - name: Run the e2e Security suite (test/security)
        if: env.SUITE == ''
        # Stack-dependent on-chain security suite (VM sandbox-escape / gas-bomb /
        # deploy-reject). Driven via the e2etest --script option.
        run: node src/index.js e2etest "$COIN" --script test:security --ref "$STACK_REF"

      - name: Run the e2e Performance suite (test/perf)
        if: env.SUITE == ''
        # Live-stack per-service latency budgets (regression ceilings).
        run: node src/index.js e2etest "$COIN" --script test:perf:budget --ref "$STACK_REF"

      # What the stack itself said, which is the one thing a failure here has never
      # carried off the runner. The suite log records that a service answered
      # wrong; only the service's own log and the network topology say why, and
      # without them a remote diagnosis is guesswork - three wrong hypotheses in a
      # row were paid for one 15-minute run at a time.
      - name: Capture stack diagnostics
        # Runs on every outcome, not just failure. A passing run is the baseline a
        # later failure is read against, and there is no second chance to collect it:
        # the runner is destroyed with the job.
        if: always()
        run: |
          OUT="$XCHAIN_NODE_DATA_DIR/e2e-logs/diagnostics"
          mkdir -p "$OUT"
          # Never let a diagnostic failure mask the real one: this step is
          # evidence-gathering, and the job is already failing.
          docker ps -a                  > "$OUT/docker-ps.txt"        2>&1 || true
          docker network ls             > "$OUT/docker-networks.txt"  2>&1 || true
          for net in $(docker network ls --filter name=xchain --format '{{.Name}}'); do
            echo "=== $net ==="        >> "$OUT/network-inspect.txt"
            docker network inspect "$net" >> "$OUT/network-inspect.txt" 2>&1 || true
          done
          for c in $(docker ps -a --format '{{.Names}}'); do
            echo "=== $c ==="          >> "$OUT/container-inspect.txt"
            # Config.Env carries credentials; take only what identifies the
            # container and how it is attached.
            docker inspect "$c" --format '{{json .NetworkSettings.Networks}}' >> "$OUT/container-inspect.txt" 2>&1 || true
            # NO --tail. Any cap is a bet on where the next defect lands, and the
            # previous 400 lost an early-suite failure in a 2-hour run. The whole suite
            # log for such a run is under a megabyte, so completeness is affordable and
            # the artifact is per-run, so nothing here overwrites a prior run's evidence.
            docker logs "$c"              > "$OUT/log-$c.txt"         2>&1 || true
          done

          # The explorer answering 503 with zero DB pools is the failure this job
          # keeps hitting, and the container log alone cannot say whether the hub
          # ever served it coin config. Capture both sides of that exchange.
          curl -s -m 10 -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"ping","params":{},"id":1}' \
            http://127.0.0.1:18080/ > "$OUT/explorer-ping.json" 2>&1 || true

          # getallconfigs is in the hub's sensitive-read tier: its response carries DB
          # credentials. Record the KEY STRUCTURE only, never a value, and keep the raw
          # body outside the uploaded directory so it cannot reach the artifact.
          RAW="$RUNNER_TEMP/hub-config-raw.json"
          curl -s -m 10 -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"getallconfigs","params":{"since_updated_at":0},"id":1}' \
            http://127.0.0.1:10000/ > "$RAW" 2>&1 || true
          RAW="$RAW" node -e '
            const fs = require("fs");
            let parsed;
            try { parsed = JSON.parse(fs.readFileSync(process.env.RAW, "utf8")); }
            catch (e) { console.log("hub response unparseable or empty"); process.exit(0); }
            const result = (parsed && parsed.result) || {};
            const tree   = result.configs || result;
            const shape  = {};
            for (const coin of Object.keys(tree || {})) {
              shape[coin] = {};
              for (const net of Object.keys(tree[coin] || {})) {
                shape[coin][net] = {};
                for (const mod of Object.keys(tree[coin][net] || {}))
                  shape[coin][net][mod] = Object.keys(tree[coin][net][mod] || {});
              }
            }
            console.log("seq=" + result.seq + " watermark=" + result.watermark);
            console.log("coins served: " + (Object.keys(shape).join(", ") || "(none)"));
            console.log(JSON.stringify(shape, null, 2));
          ' > "$OUT/hub-config-shape.txt" 2>&1 || true
          rm -f "$RAW"

          # Allowlisted so no credential-bearing var can be swept in.
          docker inspect xchain-node-xchain-explorer \
            --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
            | grep -E '^(HUB_API_HOST|HUB_PORT|HUB_VALIDATORS|NO_HUB|UPDATE_CONFIG_INTERVAL)=' \
            > "$OUT/explorer-hub-env.txt" 2>&1 || true

          echo "captured $(ls -1 "$OUT" | wc -l) diagnostic files"

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ env.COIN }}
          path: ${{ env.XCHAIN_NODE_DATA_DIR }}/e2e-logs/
          if-no-files-found: ignore
